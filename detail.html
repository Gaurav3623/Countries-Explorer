<!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">

    <title>country</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="country.css">
    <script src="country.js" defer></script>
 </head>
 <body>
        <header class="header-container">
    <div class="header-content">

      </div>

 </body>
